name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plant/**"
      - ".github/workflows/build.yml"

jobs:
  payload:
    name: plant (aarch64 static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - run: |
          set -eux
          cd plant && make
          file plant
          sha256sum plant
      - uses: actions/upload-artifact@v4
        with:
          name: plant-aarch64
          path: plant/plant
          if-no-files-found: error
